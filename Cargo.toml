[package]
name = "nanobot"
version = "0.1.3"
edition = "2021"
rust-version = "1.70"
description = "A lightweight personal AI assistant framework"
license = "MIT"
authors = ["nanobot contributors"]
keywords = ["ai", "agent", "chatbot"]
categories = ["command-line-utilities"]
repository = "https://github.com/HKUDS/nanobot"

[[bin]]
name = "nanobot"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "socks"] }
hyper = { version = "1.5", features = ["full"] }

# WebSockets
tokio-tungstenite = "0.24"
tungstenite = "0.24"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dirs = "5.0"

# Email
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
mailparse = "0.15"

# Cron
cron = "0.12"

# Terminal/Rich output
colored = "2.1"
console = "0.15"

# HTML parsing (for readability)
scraper = "0.21"
html5ever = "0.29"

# Async trait support
async-trait = "0.1"

# LLM provider support (via HTTP API calls)
# Using reqwest for API calls instead of litellm

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
